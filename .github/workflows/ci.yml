name: CI

# Runs on every PR and on pushes to main. Stages fan out in parallel, then converge:
#   lint ─┐
#   js ───┼─► build ─► e2e ─┐
#   php ──┘                 ├─► ci-passed (single required status check)
#   security, docker, workflows ─┘
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the older run; never cancel runs on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_EXTENSIONS: mbstring, pdo_sqlite

jobs:
  lint:
    name: Lint (ESLint + php -l)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: npm ci
      - run: npm run lint
      - name: PHP syntax check
        run: find src public tests/php -name '*.php' -print0 | xargs -0 -n1 php -l

  js-tests:
    name: JS unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run tests (older Node, plain run)
        if: matrix.node != 22
        run: npm test
      - name: Run tests with coverage and JUnit report
        if: matrix.node == 22
        run: |
          mkdir -p reports
          npm run test:ci | tee reports/js-output.txt
      - name: Upload test report for the summary
        if: ${{ matrix.node == 22 && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-js
          path: reports/js-junit.xml
          retention-days: 7

  php-tests:
    name: PHP unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHPUnit
        run: |
          mkdir -p reports
          vendor/bin/phpunit --log-junit reports/php-junit.xml
      - name: Upload test report for the summary
        if: ${{ matrix.php == '8.3' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-php
          path: reports/php-junit.xml
          retention-days: 7

  build:
    name: Build front-end bundle
    needs: [lint, js-tests, php-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: public/assets/app.js
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E user journey (Playwright)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: npm ci
      - name: Reuse the bundle built in the previous job
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: public/assets
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test
        env:
          CI: 'true'
      - name: Upload Playwright report (HTML, traces, videos of the journey)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload test report for the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-e2e
          path: reports/playwright.json
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: npm audit (production deps, fail on high)
        run: npm audit --omit=dev --audit-level=high
      - name: composer audit
        run: composer audit --locked

  docker:
    name: Docker image builds and passes a smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sales-importer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 sales-importer:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

  workflows:
    name: Lint workflow files (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsS https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # One stable name to mark as "required" in branch protection, whatever the matrix looks like.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [lint, js-tests, php-tests, build, e2e, security, docker, workflows]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(if .value.result == "success" then "OK    " else "ECHEC " end)\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error title=CI passed::Au moins un job requis a échoué (voir la liste ci-dessus). Ce job ne fait que le constater."
            exit 1
          fi

  # Turns every result above into ONE readable page: a coloured pipeline diagram, test counts,
  # and the user journey step by step. Shown on the run page and as a sticky PR comment.
  report:
    name: Visual report
    if: ${{ always() }}
    needs: [lint, js-tests, php-tests, build, e2e, security, docker, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # to post/update the PR comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect test reports from the other jobs
        uses: actions/download-artifact@v4
        continue-on-error: true # a failed early stage means some reports don't exist
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Build the summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node scripts/ci-summary.mjs reports > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post / update the PR comment
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true # PRs from forks get a read-only token
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes('<!-- ci-summary -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
