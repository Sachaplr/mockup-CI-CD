name: CodeQL

# Static security analysis of the JavaScript. (CodeQL has no PHP support.)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # weekly, catches newly published query packs

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # OFF by default: on a private repo, GitHub only accepts the results when code scanning
    # (GitHub Advanced Security) is enabled. To turn it on: Settings -> Secrets and variables ->
    # Actions -> Variables -> new variable ENABLE_CODEQL = true (always on for public repos).
    # Dependabot PRs get a read-only token, so CodeQL can never upload results there.
    if: ${{ (vars.ENABLE_CODEQL == 'true' || !github.event.repository.private) && github.actor != 'dependabot[bot]' }}
    permissions:
      actions: read # required by CodeQL on private repositories (reads the workflow run)
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
