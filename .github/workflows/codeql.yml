name: CodeQL

# Static security analysis of the JavaScript. (CodeQL has no PHP support.)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # weekly, catches newly published query packs

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Dependabot PRs get a read-only token: CodeQL cannot upload its results there.
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      actions: read # required by CodeQL on private repositories (reads the workflow run)
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
