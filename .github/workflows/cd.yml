name: CD

# main  -> build image -> deploy to STAGING (automatic)
# v*.*.* tag -> build image -> STAGING -> PRODUCTION (manual approval) -> GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never interrupt a deployment half-way

permissions:
  contents: read

jobs:
  image:
    name: Build & publish image to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export immutable image reference (by digest)
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to staging
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.example.com # placeholder
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy (mock)
        env:
          IMAGE: ${{ needs.image.outputs.ref }}
        run: |
          echo "A real pipeline would roll out $IMAGE here (ssh + docker compose, kubectl set image, a PaaS CLI, ...)."
      - name: Post-deploy smoke test
        env:
          IMAGE: ${{ needs.image.outputs.ref }}
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

  deploy-production:
    name: Deploy to production
    # Only for version tags. The `production` environment should have required reviewers
    # (Settings -> Environments), which turns this job into a manual approval gate.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://www.example.com # placeholder
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Deploy (mock)
        env:
          IMAGE: ${{ needs.image.outputs.ref }}
        run: echo "A real pipeline would promote $IMAGE to production here."
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
